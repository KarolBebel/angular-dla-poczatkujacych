<article class="card">
  <h2>{{ product.name }}</h2>
  <p class="price">{{ product.price }} zł</p>
  <p>{{ product.description }}</p>
  <button (click)="bought.emit(product.id)" [disabled]="!product.available">Kup</button>
  <button class="danger" (click)="removed.emit(product.id)">Usuń</button>
</article>
