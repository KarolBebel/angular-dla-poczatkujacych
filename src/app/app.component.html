<main class="container">
  <h1>🛍️ Warsztat Angular – mini-sklep</h1>

  <article class="card">
    <h2>{{ product.name }}</h2>
    <p class="price">{{ product.price }} zł</p>
    <p>{{ product.description }}</p>
    <button
      (click)="buy()"
      [disabled]="!product.available">
      Kup
    </button>
  </article>

  @if (boughtCount > 0) {
    <p class="lead">Kupiono: {{ boughtCount }}</p>
  }
</main>
